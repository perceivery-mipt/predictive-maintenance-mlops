project_name: predictive-maintenance-mlops
remote_project_dir: /opt/predictive-maintenance-mlops
compose_file: infra/docker-compose.yml
canary_compose_file: infra/docker-compose.canary.yml

required_packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - rsync
  - python3.12-venv

healthcheck_urls:
  - name: fastapi
    url: http://127.0.0.1:8000/health
  - name: canary-gateway
    url: http://127.0.0.1:8010/health
  - name: mlflow
    url: http://127.0.0.1:5050
  - name: airflow
    url: http://127.0.0.1:8081/health
  - name: prometheus
    url: http://127.0.0.1:9090/-/healthy
  - name: grafana
    url: http://127.0.0.1:3000/api/health
  - name: node-exporter
    url: http://127.0.0.1:9100/metrics
