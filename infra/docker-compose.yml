services:
  postgres:
    image: postgres:16
    container_name: predictive-maintenance-postgres
    environment:
      POSTGRES_DB: mlops
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: predictive-maintenance-redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: predictive-maintenance-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlops:mlops@postgres:5432/mlops
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5050:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command:
      - /bin/sh
      - -c
      - |
        pip install psycopg2-binary==2.9.10
        mlflow server \
          --backend-store-uri postgresql+psycopg2://mlops:mlops@postgres:5432/mlops \
          --serve-artifacts \
          --artifacts-destination /mlflow/artifacts \
          --default-artifact-root mlflow-artifacts:/ \
          --host 0.0.0.0 \
          --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: predictive-maintenance-api
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MODEL_NAME: predictive-maintenance-model
      MODEL_ALIAS: champion
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  airflow-init:
    build:
      context: ..
      dockerfile: infra/Dockerfile.airflow
    container_name: predictive-maintenance-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlops:mlops@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: predictive-maintenance-secret-key
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FEAST_REDIS_CONNECTION_STRING: redis:6379
    volumes:
      - ../dags:/opt/airflow/dags
      - ..:/opt/airflow/project
    command: >
      bash -c "airflow db migrate &&
               airflow users create
               --username admin
               --password admin
               --firstname Admin
               --lastname User
               --role Admin
               --email admin@example.com || true"

  airflow-webserver:
    build:
      context: ..
      dockerfile: infra/Dockerfile.airflow
    container_name: predictive-maintenance-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlops:mlops@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: predictive-maintenance-secret-key
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FEAST_REDIS_CONNECTION_STRING: redis:6379
    ports:
      - "8081:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ..:/opt/airflow/project
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: ..
      dockerfile: infra/Dockerfile.airflow
    container_name: predictive-maintenance-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlops:mlops@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: predictive-maintenance-secret-key
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FEAST_REDIS_CONNECTION_STRING: redis:6379
    volumes:
      - ../dags:/opt/airflow/dags
      - ..:/opt/airflow/project
    command: scheduler
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: predictive-maintenance-prometheus
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: predictive-maintenance-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped


volumes:
  grafana_data:
  postgres_data:
  mlflow_artifacts:
